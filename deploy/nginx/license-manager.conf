# 裸机部署用 Nginx 站点配置（前后端分离）
#
# 与仓库根目录的 nginx.conf 区别：后者是 Docker 容器专用，依赖 Docker 内嵌 DNS
# （resolver 127.0.0.11）与变量式 proxy_pass，宿主机上会导致反代全部 502。
# 本文件使用静态 upstream，宿主机可直接使用。
#
# 使用：
#   1) 复制到 /etc/nginx/sites-available/license-manager
#   2) 修改 server_name 与 location /api/ 的后端地址
#      - 前后端同机：proxy_pass http://127.0.0.1:18888;
#      - 前后端分离：proxy_pass http://后端机内网IP:18888;
#   3) sudo ln -sf /etc/nginx/sites-available/license-manager /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name license.example.com;      # 改成你的域名；无域名直接用 _

    root /var/www/license-ui;               # 前端构建产物目录
    index index.html;

    # 安全响应头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端 API 反代到后端（保持同源，浏览器无需 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:18888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 发票文件代理（如后端提供 /files 接口）
    location /files/ {
        proxy_pass http://127.0.0.1:18888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
